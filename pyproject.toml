[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meshops"
version = "0.1.0"
description = "Local agent-driven OS for 3D-printable meshes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "Ryan AI Studios" }]
dependencies = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "trimesh==4.12.2",
    "pydantic==2.13.4",
    "typer==0.27.0",
    "f3d==3.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.1",
    "basedpyright==1.39.9",
    "pytest==9.1.1",
]

[project.scripts]
meshops = "meshops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meshops"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["meshops"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Option()/Argument() in defaults (framework pattern).
"src/meshops/cli.py" = ["B008"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "work",
    "docs",
    "conductor",
]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # F3D 3.5 may emit DeprecationWarning on some option paths; keep narrow.
    "ignore::DeprecationWarning:f3d.*",
]
markers = [
    "f3d: needs F3D/libf3d offscreen render",
    "rogue2: needs Rogue2.stl fixture or MESHOPS_ROGUE2_PATH",
    "slow: long-running (large mesh / soak)",
]
