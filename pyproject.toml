[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meshops"
version = "0.1.0"
description = "Local agent-driven OS for 3D-printable meshes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "Ryan AI Studios" }]
dependencies = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "trimesh==4.12.2",
    "pydantic==2.13.4",
    "typer==0.27.0",
    "f3d==3.5.0",
    "pymeshlab==2025.7.post1",
    "manifold3d==3.5.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.1",
    "basedpyright==1.39.9",
    "pytest==9.1.1",
]
design = [
    "build123d==0.11.1",
]
mcp = [
    "mcp==2.0.0",
]
# Feature gate / future SDK slot — no extra runtime deps for v1 (stdlib urllib).
hosted = []
# Optional RSS for size-ladder benches (MIT; never required core — C1).
bench = [
    "psutil==7.2.2",
]
# Open3D prove-or-reject (P19) — fill pin only if PROVED; never required core.
open3d = []
# Optional image overlays + JPG/WebP sizing for proportion analyze (0012).
# PNG sizing works without Pillow via robust IHDR scan. License: MIT-CMU-HPND.
proportion = [
    "pillow==12.3.0",
]

[project.scripts]
meshops = "meshops.cli:app"
meshops-mcp = "meshops.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meshops"]

# Flattened Orca default profiles (JSON) — not discovered as package data by default.
[tool.hatch.build.targets.wheel.force-include]
"src/meshops/slice/profiles" = "meshops/slice/profiles"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["meshops"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Option()/Argument() in defaults (framework pattern).
"src/meshops/cli.py" = ["B008"]
# Blender-only script (bpy available only inside Blender process).
"src/meshops/escalate/scripts/*.py" = ["F401", "F821", "I001", "E402"]
"src/meshops/organic/scripts/*.py" = ["F401", "F821", "I001", "E402", "E501", "RUF003"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "work",
    "docs",
    "conductor",
    # bpy scripts run inside Blender only — not importable in meshops venv
    "src/meshops/escalate/scripts",
    "src/meshops/organic/scripts",
]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # F3D 3.5 may emit DeprecationWarning on some option paths; keep narrow.
    "ignore::DeprecationWarning:f3d.*",
    # MCP SDK may emit UserWarning on protocol dual-era paths; keep narrow (R10).
    "ignore::UserWarning:mcp.*",
]
markers = [
    "f3d: needs F3D/libf3d offscreen render",
    "rogue2: needs Rogue2.stl fixture or MESHOPS_ROGUE2_PATH",
    "slow: long-running (large mesh / soak)",
    "design: needs build123d (meshops[design] extra)",
    "blender: needs Blender 5.2 LTS binary (MESHOPS_BLENDER or well-known path)",
    "orcaslicer: needs OrcaSlicer binary (MESHOPS_ORCA or well-known path)",
    "mcp: needs meshops[mcp] extra (mcp==2.0.0)",
    "hosted: needs MESHOPS_HOSTED_API_KEY + network (live provider call)",
    "open3d: needs Open3D + meshops[open3d]",
]
